<style>
:root{--bg:#0a0a0a;--p:#1d1d1d;--p2:#262626;--bl:#5c9cf5;--ln:#2b2b2b;--tx:#eeeeee;--dm:#8a8a8a;--dm2:#5c5c5c;--ac:#b7e6da;--ac2:#cfeae2;--yl:#e5c07b;--rd:#e06c75;--r:18px;
--mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
[hidden]{display:none!important}
.screen{height:100dvh;display:flex;flex-direction:column}
.logo{display:block;margin:0 auto;mix-blend-mode:lighten;width:min(300px,70vw);height:auto;user-select:none;-webkit-user-drag:none}
.logo.cat{width:min(95px,26vw)}
/* вход */
#auth{align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.acard{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.fld label{display:block;color:var(--dm);font-size:12.5px;margin-bottom:7px}
.fld input{width:100%;background:var(--p);border:0;border-left:3px solid var(--ln);border-radius:var(--r);padding:14px 16px;outline:0;font-size:16px;transition:border-color .15s}
.fld input:focus{border-left-color:var(--bl)}
.btn{background:var(--ac2);color:#0a0a0a;border-radius:999px;padding:14px;font-weight:700;font-size:15px;min-height:48px}
.btn:hover{background:#fff}.btn:disabled{opacity:.5}
.lnk{color:var(--dm);font-size:13.5px;padding:8px;text-align:center}.lnk:hover{color:var(--tx)}
.err{color:var(--rd);font-size:13.5px;line-height:1.45;min-height:18px}
.err.info{color:var(--dm)}
.dbst{font-size:12px;text-align:center;color:var(--dm2);line-height:1.5}.dbst.ok{color:#7fd6a4}.dbst.warn{color:var(--yl)}.dbst.bad{color:var(--rd)}
.hint{color:var(--dm2);font-size:12px;text-align:center;line-height:1.5}
/* приложение */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;flex:none}
.hl{display:flex;align-items:center;gap:10px;color:var(--dm);font-size:13.5px;min-width:0}
.hl img{width:28px;height:28px;border-radius:0;object-fit:contain}.hl b{color:var(--tx);font-weight:600}
.hr{display:flex;align-items:center;gap:8px;flex:none}
.pill{background:var(--p);border-radius:999px;padding:8px 14px;font-size:12.5px;color:var(--dm);white-space:nowrap}
.pill b{color:var(--tx);font-weight:500}.pill.low b{color:var(--yl)}.pill.out b{color:var(--rd)}
.kbtn{background:var(--p);border-radius:999px;padding:8px 12px;font-size:12.5px;color:var(--dm);min-height:34px}
.kbtn:hover{color:var(--tx)}
#body{flex:1;min-height:0;display:flex;flex-direction:column}
.home #body{justify-content:center;padding-bottom:6vh}
#hero{padding:0 16px 26px}
.home #scroll{display:none}.chatmode #hero{display:none}
#scroll{flex:1;overflow-y:auto;padding:6px 16px 10px}
.col{max-width:820px;margin:0 auto}
.dock{padding:0 16px calc(14px + env(safe-area-inset-bottom));flex:none}
.pbox{max-width:820px;margin:0 auto;background:var(--p);border-left:3px solid var(--bl);border-radius:var(--r);padding:14px 12px 12px 18px;transition:border-color .15s}
.home .pbox{max-width:640px}
.pbox:focus-within{border-left-color:var(--bl)}
textarea{width:100%;background:none;border:0;outline:0;resize:none;font-size:16px;line-height:1.5;min-height:26px;max-height:170px;color:var(--tx);caret-color:var(--ac)}
textarea::placeholder{color:var(--dm2)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.mchip{display:flex;align-items:center;gap:9px;color:var(--dm);font-size:13.5px;padding:8px 4px;min-height:40px;min-width:0;text-align:left}
.mchip:hover{color:var(--tx)}
.mchip i{display:none}
.pbox{padding-left:20px!important}
.mchip .bd{color:var(--bl);font-weight:500}
.mchip{gap:14px}
.mchip b{color:var(--tx);font-weight:600}.mchip .e{color:var(--ac)}
.mchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send{width:46px;height:46px;border-radius:999px;background:var(--ac2);color:#0a0a0a;display:grid;place-items:center;flex:none;transition:background .15s}
.send:hover{background:#fff}.send:disabled{opacity:.35}
.send svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.send.stop svg{display:none}.send.stop::after{content:"";width:14px;height:14px;background:currentColor;border-radius:4px}
.tip{max-width:640px;margin:14px auto 0;text-align:right;color:var(--dm);font-size:13px;word-spacing:1px}
.tip b{color:var(--tx);font-weight:500}
.chatmode .tip{display:none}
#foot{display:flex;justify-content:space-between;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));color:var(--dm2);font-size:13px;flex:none}
.chatmode #foot{display:none}
/* список чатов */
#cols{flex:1;min-height:0;display:flex}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#side{width:280px;flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 10px 12px;border-right:1px solid var(--ln);background:#0d0d0d}
#newc{display:flex;align-items:center;gap:10px;border-radius:999px;background:var(--p);padding:12px 16px;text-align:left;color:var(--tx);font-size:14px;min-height:46px}
#newc:hover{background:var(--p2)}#newc span{color:var(--bl);font-size:18px;line-height:1}
.sl{color:var(--dm2);font-size:12px;padding:8px 14px 2px}
#clist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.ci{display:flex;align-items:center;gap:6px;border-radius:14px;padding:0 6px 0 14px;min-height:44px;cursor:pointer;color:var(--dm);font-size:14px}
.ci:hover,.ci.on{background:var(--p);color:var(--tx)}.ci.on{box-shadow:inset 3px 0 0 var(--bl)}
.ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx{width:32px;height:32px;border-radius:50%;color:var(--dm2);font-size:18px;opacity:0;flex:none}
.ci:hover .cx,.ci.on .cx{opacity:1}.cx:hover{background:var(--p2);color:var(--rd)}
@media(hover:none){.cx{opacity:1}}
.cnone{color:var(--dm2);font-size:13px;padding:10px 14px}
#sbd{display:none}
.sb{padding:8px 12px;border-radius:999px}
@media(min-width:701px){.sclosed #side{display:none}}
@media(max-width:700px){
  #side{position:fixed;left:0;top:0;bottom:0;width:min(310px,86vw);z-index:25;transform:translateX(-102%);transition:transform .2s;padding-top:calc(10px + env(safe-area-inset-top))}
  .sopen #side{transform:none}
  .sopen #sbd{display:block;position:fixed;inset:0;background:#0009;z-index:24}
}
/* сообщения */
.q{background:var(--p);border-left:3px solid var(--bl);border-radius:var(--r);padding:14px 16px;margin:18px 0 14px;white-space:pre-wrap;word-wrap:break-word;line-height:1.55}
.who{display:flex;align-items:center;gap:9px;color:var(--dm);font-size:13px;margin:0 0 8px 2px}
.who i{width:10px;height:10px;background:linear-gradient(135deg,var(--ac),#7aa8ff 55%,#c79bff);border-radius:2px}
.a{line-height:1.65;white-space:pre-wrap;word-wrap:break-word;padding:0 2px;font-size:15px}
.a.live::after{content:"";display:inline-block;width:8px;height:16px;background:var(--ac);margin-left:3px;vertical-align:-3px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.a.bad{color:var(--rd);border-left:2px solid var(--rd);padding-left:12px}
.meta{color:var(--dm2);font-size:12px;margin:9px 2px 4px}
/* палитра */
#ov{position:fixed;inset:0;background:#000b;z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.sheet{width:100%;max-width:540px;background:var(--p);border:1px solid var(--ln);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;max-height:70dvh}
.sh-t{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;color:var(--dm);font-size:12.5px}
.sh-t button{color:var(--dm);padding:4px 8px}
.sheet input{margin:6px 12px 8px;background:var(--p2);border:0;border-left:3px solid var(--bl);border-radius:14px;padding:13px 14px;outline:0;font-size:16px}
.sheet input:focus{border-left-color:var(--bl)}
#plist{overflow-y:auto;padding:0 6px 8px}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;text-align:left;font-size:14.5px;min-height:46px}
.it small{color:var(--dm2);font-size:12.5px;white-space:nowrap}
.it.on,.it:hover{background:var(--p2)}
.it .m{color:var(--ac);margin-right:8px}
.empty{color:var(--dm2);padding:14px;font-size:13.5px}
@media(max-width:700px){
  #ov{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:22px 22px 0 0;max-height:78dvh;padding-bottom:env(safe-area-inset-bottom)}
  .hl .nm{display:none}
  .kbtn .k{display:none}
}
</style>
</head>

/* SHA-256 и PBKDF2-HMAC-SHA256 на чистом JS (запасной вариант, когда нет crypto.subtle) */
const K256=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
const INIT256=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
const Wk=new Uint32Array(64);
function blk(h,m,o){
  for(let i=0;i<16;i++)Wk[i]=m[o+i];
  for(let i=16;i<64;i++){const a=Wk[i-15],b=Wk[i-2];
    const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3);
    const s1=((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10);
    Wk[i]=(Wk[i-16]+s0+Wk[i-7]+s1)|0;}
  let a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
  for(let i=0;i<64;i++){
    const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
    const ch=(e&f)^(~e&g);
    const t1=(hh+S1+ch+K256[i]+Wk[i])|0;
    const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
    const mj=(a&b)^(a&c)^(b&c);
    const t2=(S0+mj)|0;
    hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
  h[0]+=a;h[1]+=b;h[2]+=c;h[3]+=d;h[4]+=e;h[5]+=f;h[6]+=g;h[7]+=hh;
}
function finishState(state,bytes,prefixLen){
  const h=new Uint32Array(state),l=bytes.length,total=((l+9+63)>>6)<<6;
  const buf=new Uint8Array(total);buf.set(bytes);buf[l]=0x80;
  const bits=(prefixLen+l)*8,dv=new DataView(buf.buffer);
  dv.setUint32(total-8,Math.floor(bits/4294967296));dv.setUint32(total-4,bits>>>0);
  const m=new Uint32Array(total/4);for(let i=0;i<m.length;i++)m[i]=dv.getUint32(i*4);
  for(let o=0;o<m.length;o+=16)blk(h,m,o);
  return h;
}
function wordsToBytes(w){const o=new Uint8Array(w.length*4),dv=new DataView(o.buffer);for(let i=0;i<w.length;i++)dv.setUint32(i*4,w[i]);return o}
function sha256js(bytes){return wordsToBytes(finishState(INIT256,bytes,0))}
function pbkdf2js(pw,salt,iter){
  let key=pw;if(key.length>64)key=sha256js(key);
  const ip=new Uint8Array(64).fill(0x36),op=new Uint8Array(64).fill(0x5c);
  for(let i=0;i<key.length;i++){ip[i]^=key[i];op[i]^=key[i]}
  const toW=b=>{const dv=new DataView(b.buffer),w=new Uint32Array(16);for(let i=0;i<16;i++)w[i]=dv.getUint32(i*4);return w};
  const is=new Uint32Array(INIT256),os=new Uint32Array(INIT256);blk(is,toW(ip),0);blk(os,toW(op),0);
  const msg=new Uint8Array(salt.length+4);msg.set(salt);msg[msg.length-1]=1;
  const inner=finishState(is,msg,64);
  let u=finishState(os,wordsToBytes(inner),64);
  const t=new Uint32Array(u),m=new Uint32Array(16),h=new Uint32Array(8);
  for(let n=1;n<iter;n++){
    m.set(u);m[8]=0x80000000;for(let i=9;i<15;i++)m[i]=0;m[15]=768;
    h.set(is);blk(h,m,0);
    m.set(h);m[8]=0x80000000;for(let i=9;i<15;i++)m[i]=0;m[15]=768;
    h.set(os);blk(h,m,0);
    u=new Uint32Array(h);for(let i=0;i<8;i++)t[i]^=u[i];
  }
  return wordsToBytes(t);
}

const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=n=>Math.round(n).toLocaleString("ru-RU").replace(/ /g," ");
let prefs=Object.assign({eff:1,temp:0.7,mem:false,base:""},LS.get("euclid_prefs",{}));
prefs.base="";
const savePrefs=()=>LS.set("euclid_prefs",prefs);
let S=null,hist=[],busy=false,ctrl=null,chats=[],cur=null;

/* ====== хеширование ====== */
const te=new TextEncoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function pbkdf2(pw,saltHex){
  if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveBits"]);
    return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:unhex(saltHex),iterations:ITER,hash:"SHA-256"},k,256))}
  await new Promise(r=>setTimeout(r,20));return hex(pbkdf2js(te.encode(pw),unhex(saltHex),ITER));
}
async function sha(s){return (window.crypto&&crypto.subtle)?hex(await crypto.subtle.digest("SHA-256",te.encode(s))):hex(sha256js(te.encode(s)))}

/* ====== Firebase (REST) ====== */
async function fb(method,path,body){
  let r;
  try{r=await Promise.race([
    fetch(`${DB}/${path}.json`,{method,headers:body!==undefined?{"Content-Type":"application/json"}:undefined,body:body!==undefined?JSON.stringify(body):undefined}),
    new Promise((_,j)=>setTimeout(()=>j(new Error("timeout")),FB_TIMEOUT))])}
  catch(e){throw new Error(e.message==="timeout"?"База данных не отвечает за "+Math.round(FB_TIMEOUT/1000)+" с. Возможно, Firebase недоступен из твоей сети (попробуй VPN).":"Нет связи с базой данных. Проверь интернет или включи VPN.")}
  if(r.status===401||r.status===403)throw new Error("База данных закрыта правилами (permission denied). Открой Firebase → Realtime Database → Rules и вставь правила из инструкции.");
  if(!r.ok)throw new Error("Ошибка базы данных ("+r.status+")");
  return r.json();
}
const today=()=>new Date().toISOString().slice(0,10);   // 00:00 UTC = 03:00 МСК

async function register(name,pw){
  if(await fb("GET","users/"+name))throw new Error("Такой логин уже занят");
  const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
  const k=await pbkdf2(pw,salt),v=await sha(k);
  try{await fb("PUT","users/"+name,{salt,v,created:new Date().toISOString()})}
  catch(e){if(/permission/i.test(e.message))throw new Error("Не удалось создать аккаунт: логин занят или база закрыта правилами.");throw e}
  return {u:name,k};
}
async function login(name,pw){
  const bad=new Error("Неверный логин или пароль");
  const u=await fb("GET","users/"+name);if(!u||!u.salt||!u.v)throw bad;
  const k=await pbkdf2(pw,u.salt);if(await sha(k)!==u.v)throw bad;
  return {u:name,k};
}
async function checkSession(s){const u=await fb("GET","users/"+s.u);return !!(u&&u.v&&await sha(s.k)===u.v)}

/* ====== интерфейс ====== */
function setMode(){const h=!hist.length;$("#app").classList.toggle("home",h);$("#app").classList.toggle("chatmode",!h)}
function effName(){return EFFORTS[prefs.eff][0]}
function drawChip(){$("#mname").textContent=MODEL;$("#eff").textContent="· "+effName()}
function drawTip(){$("#tip").innerHTML='<b>shift+enter</b> новая строка &nbsp; <b>ctrl+p</b> команды'}

function render(){
  setMode();
  $("#col").innerHTML=hist.map((m,i)=>`<div class="q">${esc(m.q)}</div>
   <div class="who"><i></i>${esc(MODEL)}</div>
   <div class="a ${m.err?"bad":""} ${m.live?"live":""}" data-i="${i}">${esc(m.err||m.a||"")}</div>
   ${m.live?"":`<div class="meta">${esc(m.eff||"")} · ${((m.ms||0)/1000).toFixed(1)} с · ${fmt(m.tok||0)} ток.</div>`}`).join("")+'<div style="height:12px"></div>';
  const s=$("#scroll");s.scrollTop=s.scrollHeight;
}
const hkey=()=>"euclid_h_"+S.u, ckey=()=>"euclid_chats_"+S.u;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ttl=q=>{q=(q||"").replace(/\s+/g," ").trim();return q?(q.length>38?q.slice(0,38)+"…":q):"Новый чат"};
const isMob=()=>innerWidth<=700;
function startNew(){cur={id:uid(),title:"",ts:Date.now(),h:[]};hist=cur.h}
function loadChats(){
  let c=LS.get(ckey(),null);chats=[];
  if(Array.isArray(c))chats=c.filter(x=>x&&x.id&&Array.isArray(x.h));
  else{const old=LS.get(hkey(),[]);if(Array.isArray(old)&&old.length)chats.push({id:uid(),title:ttl(old[0].q),ts:Date.now(),h:old})}
  chats.forEach(x=>x.h.forEach(m=>m.live=false));
  startNew();
}
function persist(){LS.set(ckey(),chats.map(c=>({id:c.id,title:c.title,ts:c.ts,h:c.h.filter(m=>!m.live).slice(-60)})))}
function saveHist(){
  if(!cur)return;
  if(hist.length&&!chats.includes(cur)){cur.title=ttl(hist[0].q);chats.unshift(cur)}
  if(chats.includes(cur))cur.ts=Date.now();
  persist();drawSide();
}
function drawSide(){
  const l=$("#clist");
  l.innerHTML=chats.length?chats.map(c=>`<div class="ci${c===cur?" on":""}" data-id="${c.id}"><span class="ct">${esc(c.title||ttl(c.h[0]&&c.h[0].q))}</span><button class="cx" data-x="${c.id}" aria-label="Удалить чат" title="Удалить">×</button></div>`).join(""):'<div class="cnone">Пока нет чатов</div>';
}
function selectChat(id){
  if(busy)return;const c=chats.find(x=>x.id===id);if(!c)return;
  cur=c;hist=c.h;render();drawSide();closeSide();
}
function delChat(id){
  if(busy&&cur&&cur.id===id)return;
  chats=chats.filter(c=>c.id!==id);persist();
  if(cur&&cur.id===id){startNew();render()}
  drawSide();
}
function toggleSide(){const a=$("#app");a.classList.toggle(isMob()?"sopen":"sclosed")}
function closeSide(){if(isMob())$("#app").classList.remove("sopen")}
$("#sbtn").addEventListener("click",toggleSide);
$("#sbd").addEventListener("click",closeSide);
$("#newc").addEventListener("click",()=>newSession());
$("#clist").addEventListener("click",e=>{
  const x=e.target.closest("[data-x]");if(x){e.stopPropagation();delChat(x.dataset.x);return}
  const i=e.target.closest(".ci");if(i)selectChat(i.dataset.id);
});

const baseUrl=()=>(prefs.base||"").replace(/\/+$/,"");
let srvCache={t:0,url:""};
async function getBase(){
  if(prefs.base)return baseUrl();
  if(srvCache.url&&Date.now()-srvCache.t<30000)return srvCache.url;
  let d=null;
  try{const [a,b]=await Promise.all([fetch(DB+"/server/url.json"),fetch(DB+"/server/ts.json")]);if(a.ok&&b.ok)d={url:await a.json(),ts:await b.json()}}catch(e){}
  if(!d||!d.url||Date.now()-(+d.ts||0)>240000){srvCache={t:0,url:""};throw new Error("Модель сейчас выключена. Попробуй позже.")}
  srvCache={t:Date.now(),url:String(d.url).replace(/\/+$/,"")};return srvCache.url;
}
const estTok=s=>Math.ceil(s.length/2.5);

async function send(){
  if(busy){if(ctrl){ctrl.stop=true;try{ctrl.rd&&ctrl.rd.cancel()}catch(e){}}return}
  const t=$("#inp").value.trim();if(!t)return;
  const msgs=[];
  const hs=prefs.mem?hist.slice(-4).filter(p=>p.a&&!p.err):[];
  hs.forEach(p=>{msgs.push({role:"user",content:p.q},{role:"assistant",content:p.a})});
  msgs.push({role:"user",content:t});
  const pe=msgs.reduce((n,m)=>n+estTok(m.content)+6,12);
  const cap=EFFORTS[prefs.eff][1];
  $("#inp").value="";fit();
  const m={q:t,a:"",live:true,eff:effName()};hist.push(m);busy=true;setSend();render();saveHist();
  ctrl={stop:false,rd:null};const t0=performance.now();let usage=null;
  try{
    const r=await fetch((await getBase())+"/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:msgs,temperature:+prefs.temp,max_tokens:cap,stop:STOP,stream:true,stream_options:{include_usage:true}})});
    if(!r.ok)throw new Error("Ошибка сервера модели "+r.status);
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="";ctrl.rd=rd;
    for(;;){
      const {done,value}=await rd.read();if(done||ctrl.stop)break;
      buf+=dec.decode(value,{stream:true});const parts=buf.split("\n");buf=parts.pop();
      for(const ln of parts){
        if(!ln.startsWith("data:"))continue;const d=ln.slice(5).trim();if(!d||d==="[DONE]")continue;
        try{const j=JSON.parse(d);if(j.usage)usage=j.usage;
          const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
          if(c){m.a+=c;const el=document.querySelector(`.a[data-i="${hist.indexOf(m)}"]`);if(el){el.textContent=m.a;const s=$("#scroll");s.scrollTop=s.scrollHeight}}}catch(e){}
      }
    }
    m.a=(m.a||"").trim()||(ctrl.stop?"(остановлено)":"(пустой ответ)");
  }catch(e){m.err=(e.message&&e.message!=="Failed to fetch")?e.message:(prefs.base?"Нет связи с моделью ("+baseUrl()+").":"Нет связи с моделью. Возможно, она выключена или перезапускается — попробуй через минуту.");srvCache={t:0,url:""}}
  m.live=false;m.ms=performance.now()-t0;
  m.tok=usage&&usage.total_tokens?usage.total_tokens:(pe+estTok(m.a||""));
  busy=false;ctrl=null;setSend();saveHist();render();
}
function setSend(){const b=$("#send");b.classList.toggle("stop",busy);b.disabled=false;b.setAttribute("aria-label",busy?"Остановить":"Отправить")}
function fit(){const t=$("#inp");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,170)+"px"}

/* ====== палитра команд ====== */
let pitems=[],pcb=null,pmode="list",psel=0,pall=[];
function openList(title,items,cb,filter=true){
  pmode="list";pall=items;pcb=cb;$("#ptitle").textContent=title;
  const i=$("#pin");i.value="";i.placeholder="Поиск…";i.type="text";i.hidden=!filter;
  $("#ov").hidden=false;drawList();setTimeout(()=>filter&&i.focus(),30);
}
function drawList(){
  const q=$("#pin").value.trim().toLowerCase();
  pitems=pall.filter(x=>!q||x.label.toLowerCase().includes(q));
  psel=Math.min(psel,Math.max(0,pitems.length-1));
  $("#plist").innerHTML=pitems.length?pitems.map((x,n)=>`<button class="it ${n===psel?"on":""}" data-n="${n}"><span>${x.mark?'<span class="m">●</span>':""}${esc(x.label)}</span><small>${esc(x.hint||"")}</small></button>`).join(""):'<div class="empty">Ничего не найдено</div>';
}
function openInput(title,value,placeholder,cb,type="text"){
  pmode="input";pcb=cb;$("#ptitle").textContent=title;pitems=[];pall=[];
  const i=$("#pin");i.hidden=false;i.type=type;i.value=value||"";i.placeholder=placeholder||"";
  $("#plist").innerHTML='<div class="empty">Enter — сохранить, Esc — отмена</div>';
  $("#ov").hidden=false;setTimeout(()=>i.focus(),30);
}
function closeOv(){$("#ov").hidden=true;pcb=null}
function pick(n){const x=pitems[n];if(!x||!pcb)return;const cb=pcb;closeOv();cb(x)}
$("#pin").addEventListener("input",()=>{if(pmode==="list"){psel=0;drawList()}});
$("#pin").addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeOv();return}
  if(pmode==="input"){if(e.key==="Enter"){e.preventDefault();const v=$("#pin").value.trim(),cb=pcb;closeOv();cb&&cb(v)}return}
  if(e.key==="ArrowDown"){e.preventDefault();psel=Math.min(pitems.length-1,psel+1);drawList();scrollSel()}
  else if(e.key==="ArrowUp"){e.preventDefault();psel=Math.max(0,psel-1);drawList();scrollSel()}
  else if(e.key==="Enter"){e.preventDefault();pick(psel)}
});
function scrollSel(){const el=$("#plist .it.on");el&&el.scrollIntoView({block:"nearest"})}
$("#plist").addEventListener("click",e=>{const b=e.target.closest(".it");if(b)pick(+b.dataset.n)});
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeOv()});
$("#pclose").onclick=closeOv;

function pickEffort(){
  openList("Усилие (максимум токенов в ответе)",EFFORTS.map((e,i)=>({label:e[0],hint:"до "+fmt(e[1])+" токенов",mark:i===prefs.eff,id:i})),x=>{prefs.eff=x.id;savePrefs();drawChip()},false);
}
function pickTemp(){
  openList("Температура",[0.2,0.4,0.7,1.0,1.3].map(v=>({label:String(v),hint:v<=0.3?"точнее":v>=1?"свободнее":"",mark:prefs.temp===v,id:v})),x=>{prefs.temp=x.id;savePrefs()},false);
}
function newSession(){if(busy)return;closeSide();if(!hist.length){if(!isMob())$("#inp").focus();return}startNew();render();drawSide();drawTip();if(!isMob())$("#inp").focus()}
function logout(){LS.del("euclid_sess");S=null;hist=[];chats=[];cur=null;showAuth()}
function commands(){
  return [
    {label:"Новая сессия",hint:"Ctrl+N",run:newSession},
    {label:"Выбрать усилие",hint:effName(),run:pickEffort},
    {label:"Температура",hint:String(prefs.temp),run:pickTemp},
    {label:"Контекст диалога",hint:prefs.mem?"включён":"выключен",run:()=>{prefs.mem=!prefs.mem;savePrefs()}},
    {label:"Удалить этот чат",hint:"",run:()=>{if(cur)delChat(cur.id)}},
    {label:"Выйти из аккаунта",hint:S?S.u:"",run:logout},
  ];
}
function openPalette(){if(!S)return;openList("Команды",commands().map(c=>({label:c.label,hint:c.hint,run:c.run})),x=>x.run())}
$("#kb").onclick=openPalette;$("#mchip").onclick=pickEffort;

addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="p"){e.preventDefault();$("#ov").hidden?openPalette():closeOv()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="n"&&S){e.preventDefault();newSession()}
  else if(e.key==="Escape"&&!$("#ov").hidden)closeOv();
  else if(!$("#ov").hidden&&$("#pin").hidden&&pmode==="list"){
    if(e.key==="ArrowDown"){e.preventDefault();psel=Math.min(pitems.length-1,psel+1);drawList()}
    else if(e.key==="ArrowUp"){e.preventDefault();psel=Math.max(0,psel-1);drawList()}
    else if(e.key==="Enter"){e.preventDefault();pick(psel)}
  }
});
$("#inp").addEventListener("input",fit);
$("#inp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&innerWidth>700){e.preventDefault();send()}});
$("#send").onclick=send;

/* ====== вход / выход ====== */
async function dbCheck(){
  const el=$("#dbst");el.className="dbst";el.textContent="проверяю связь с базой…";
  try{
    const r=await Promise.race([fetch(DB+"/.json?shallow=true"),new Promise((_,j)=>setTimeout(()=>j(new Error("timeout")),Math.min(FB_TIMEOUT,8000)))]);
    if(r.status===401||r.status===403){el.className="dbst warn";el.textContent="● база доступна, но закрыта правилами — вставь правила в Firebase"}
    else if(r.ok){el.className="dbst ok";el.textContent="● база данных доступна"}
    else{el.className="dbst warn";el.textContent="● база ответила ошибкой "+r.status}
  }catch(e){el.className="dbst bad";el.textContent="● нет связи с базой (Firebase может быть заблокирован — включи VPN)"}
}
let regMode=false;
function drawAuth(){$("#aerr").className="err";
  $("#go").textContent=regMode?"Создать аккаунт":"Войти";
  $("#sw").textContent=regMode?"Уже есть аккаунт? Войти":"Нет аккаунта? Создать";
  $("#lp").autocomplete=regMode?"new-password":"current-password";$("#aerr").textContent="";
}
$("#sw").onclick=()=>{regMode=!regMode;drawAuth()};
$("#aform").addEventListener("submit",async e=>{
  e.preventDefault();const err=$("#aerr"),go=$("#go");err.textContent="";
  const name=$("#lu").value.trim().toLowerCase(),pw=$("#lp").value;
  if(!/^[a-z0-9_]{3,20}$/.test(name)){err.textContent="Логин: 3–20 символов, только латиница, цифры и _";return}
  if(regMode&&pw.length<6){err.textContent="Пароль должен быть не короче 6 символов";return}
  if(!pw){err.textContent="Введи пароль";return}
  go.disabled=true;const old=go.textContent;go.textContent="Подожди…";err.className="err info";err.textContent="Проверяю данные…";
  try{const s=regMode?await register(name,pw):await login(name,pw);LS.set("euclid_sess",s);$("#lp").value="";err.textContent="";await enter(s)}
  catch(ex){err.className="err";err.textContent=ex.message}
  go.disabled=false;go.textContent=old;
});
function showAuth(){dbCheck();$("#app").hidden=true;$("#auth").hidden=false;$("#ov").hidden=true;regMode=false;drawAuth();setTimeout(()=>$("#lu").focus(),30)}
async function enter(s){
  S=s;$("#auth").hidden=true;$("#app").hidden=false;
  $("#who").textContent="@"+s.u;loadChats();
  drawChip();drawTip();render();drawSide();setSend();
}
(async function init(){
  drawChip();
  const s=LS.get("euclid_sess",null);
  if(s&&s.u&&s.k){
    try{if(await checkSession(s)){await enter(s);return}else LS.del("euclid_sess")}
    catch(e){showAuth();$("#aerr").textContent=e.message;return}
  }
  showAuth();
})();
</script>
</body>
